<header class="home__header">
  <img class="home__logo" [src]="logoSrc" alt="VegAqui" />
  <p class="home__tagline">
    Ser <strong>SAUDÁVEL</strong> nunca foi tão
    <span class="home__tagline-accent">prático!</span>
  </p>
  <p class="home__subtitle">Experimente e surpreenda-se</p>
</header>

@for (category of categories; track category.title) {
  <section class="home__category">
    <category-banner [title]="category.title" />

    <div class="home__category-products">
      <vine-connector [sides]="category.sides" />

      @for (product of category.products; track $index) {
        <product-card [product]="product" [imagePosition]="category.sides[$index]" />
      }
    </div>
  </section>
}

<footer class="home__footer">
  <p class="home__address">{{ contact.address }}</p>
  <a class="home__link" [href]="phoneHref" target="_blank" rel="noopener">
    <social-icon icon="phone" />
    {{ contact.phone | phone }}
  </a>
  <a class="home__link" [href]="whatsappHref" target="_blank" rel="noopener">
    <social-icon icon="whatsapp" />
    {{ contact.whatsapp | phone }}
  </a>
  <a class="home__link" [href]="instagramHref" target="_blank" rel="noopener">
    <social-icon icon="instagram" />
    &#64;{{ contact.instagram }}
  </a>
</footer>
