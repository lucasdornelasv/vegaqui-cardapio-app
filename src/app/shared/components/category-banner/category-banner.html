<div class="category-banner">
  <div class="category-banner__layer category-banner__layer--back"></div>

  <div class="category-banner__layer category-banner__layer--front">
    <span class="category-banner__text">{{ title() }}</span>
  </div>

  <svg class="category-banner__bow" viewBox="0 0 40 40" aria-hidden="true">
    <ellipse
      cx="10"
      cy="20"
      rx="10"
      ry="7"
      fill="var(--color-secondary-400)"
      transform="rotate(-20 10 20)"
    />
    <ellipse
      cx="30"
      cy="20"
      rx="10"
      ry="7"
      fill="var(--color-secondary-400)"
      transform="rotate(20 30 20)"
    />
    <circle cx="20" cy="20" r="4.5" fill="var(--color-secondary-700)" />
  </svg>
</div>
